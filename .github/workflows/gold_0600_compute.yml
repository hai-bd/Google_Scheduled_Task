name: Gold 06:00 Pre-Market Compute

on:
  schedule:
    # UTC 22:00 Sun-Thu == Beijing Time (UTC+8) 06:00 Mon-Fri
    # 如希望周六早上也汇总周五夜盘收盘，可改为: '0 22 * * 0-5'
    # 如希望每天都跑（含周末），可改为: '0 22 * * *'
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      force_full:
        description: "强制召开完整4委员两轮投委会（跳过轻量模式）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gold Multi-Agent Compute (06:00 CST)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_full }}" = "true" ]; then
            python cloud/gold_daily_compute.py --force-full
          else
            python cloud/gold_daily_compute.py
          fi

      - name: Commit & push daily records
        run: |
          git config user.name "gold-committee-bot"
          git config user.email "gold-committee-bot@users.noreply.github.com"
          git add records/
          if ! git diff --cached --quiet; then
            git commit -m "chore: save daily gold premarket records ($(TZ=Asia/Shanghai date +%Y-%m-%d))"
            git push
          else
            echo "No changes in records/ to commit."
          fi
