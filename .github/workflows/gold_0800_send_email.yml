name: Gold 08:00 Exact Email Dispatch

on:
  # 已停用每日云端定时发信（当前改用本地运行发信）；
  # 仅保留 workflow_dispatch 方便未来如需手动在 GitHub Actions 触发。
  workflow_dispatch:
    inputs:
      no_wait:
        description: "立即发送（不等待至 08:00）"
        required: false
        default: true
        type: boolean
      force_resend:
        description: "即使今日已发送也强制重发"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait until 08:00 CST & Send Email to QQ Mail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS="--fallback-compute"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.no_wait }}" = "true" ]; then
              ARGS="$ARGS --no-wait"
            else
              ARGS="$ARGS --wait-until 08:00"
            fi
            if [ "${{ github.event.inputs.force_resend }}" = "true" ]; then
              ARGS="$ARGS --force-resend"
            fi
          else
            ARGS="$ARGS --wait-until 08:00"
          fi
          python cloud/send_daily_email.py $ARGS

      - name: Commit & push updated dispatch status
        run: |
          git config user.name "gold-committee-bot"
          git config user.email "gold-committee-bot@users.noreply.github.com"
          git add records/
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark daily gold email sent ($(TZ=Asia/Shanghai date +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
